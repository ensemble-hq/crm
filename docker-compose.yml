# The CRM's own Postgres and Redis for development, on ports that don't clash with anything else.
name: ensemble-crm
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: dev
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - "6389:6379"
volumes:
  postgres_data:
