<!doctype html>
<html lang="en" data-theme="keel" data-mode="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM</title>
    <script>
      // Apply a saved light or dark choice before the first paint. Kept in step with src/app/colorMode.ts.
      try {
        var mode = localStorage.getItem('crm-color-mode');
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
